name: Backend CI/CD & Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  validate-and-test:
    name: Lint, Typecheck & Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Quality Gate — Biome Lint & Format Check
        run: npx biome check .

      - name: Quality Gate — Knip Dead Code Analysis
        run: npx knip

      - name: Quality Gate — TypeScript Compilation
        run: npx tsc --noEmit

      - name: Quality Gate — Unit Tests
        run: npm test

  deploy-aws-cdk:
    name: Deploy Near-Free-Tier AWS CDK Stack (ap-south-1)
    needs: validate-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Configure AWS Credentials via GitHub OIDC
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ap-south-1
          audience: sts.amazonaws.com
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_BACKEND_DEPLOY_ROLE_ARN }}

      - name: CDK Synthesize Infrastructure
        run: |
          cd packages/cdk
          npx cdk synth

      - name: Deploy AWS CDK Stacks
        if: env.AWS_ROLE_ARN != ''
        run: |
          cd packages/cdk
          npx cdk deploy --all --require-approval never
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_BACKEND_DEPLOY_ROLE_ARN }}
