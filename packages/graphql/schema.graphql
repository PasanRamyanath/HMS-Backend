}

"""
Immutable audit trail action types for tamper-evident SHA-256 event chaining.
"""
enum AuditAction {
  """
  New record inserted.
  """
  CREATE
  """
  Existing record updated.
  """
  UPDATE
  """
  Record deleted or soft-deleted.
  """
  DELETE
  """
  State machine or lifecycle status transition.
