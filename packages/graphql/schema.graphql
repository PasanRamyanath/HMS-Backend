"""
type HotelTenant @aws_cognito_user_pools @aws_iam @aws_lambda @aws_api_key {
  """
  Unique SaaS tenant identifier (e.g. 'tenant-sigiriya-luxury-001').
  """
  id: ID!
  """
  Display property trade name.
  """
