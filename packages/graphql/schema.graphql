"""
Sri Lankan statutory tax registration status and compounding preset.
"""
enum TaxCategory {
  """
  Full-service registered hotel charging 10% SC + 1% TDL + 2.5641% SSCL + 18% VAT.
  """
  FULL_SERVICE_HOTEL_VAT
