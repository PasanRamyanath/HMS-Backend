query ListMenuCatalog($tenantId: ID!) {
  listMenuCatalog(tenantId: $tenantId) {
    id
    name
    department
    displayOrder
    isActive
    items {
      id
      categoryId
      name
      description
      priceLkr
      dietaryTags
      isAvailable
      inStock
      prepTimeMinutes
      imageUrl
    }
  }
}

query GetMenuItem($tenantId: ID!, $id: ID!) {
  getMenuItem(tenantId: $tenantId, id: $id) {
    id
    categoryId
    name
    description
    priceLkr
    dietaryTags
    isAvailable
    inStock
    prepTimeMinutes
    imageUrl
  }
}
