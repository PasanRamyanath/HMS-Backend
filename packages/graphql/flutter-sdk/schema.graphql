# ==============================================================================
# Sri Lanka Hotel Management System (HMS) - Mobile SDK GraphQL Schema
# Purpose-built for Flutter / Dart Client Code Generation (Artemis / Ferry / Codegen)
# Architecture: Single-Table DynamoDB (PK = TENANT#<id>), CBSL LankaQR, 4-Stage Tax
# Target Region: AWS ap-south-1 (Mumbai) • Always Free Tier Compliant
# ==============================================================================

# ==============================================================================
# Sri Lankan Cloud SaaS Hotel Management System (HMS) & Contactless QR Platform.
# Single-Table Multi-Tenant 42-Entity AppSync GraphQL Schema (APPSYNC_JS_1_0_0).
#
# Complies with:
# 1. Sri Lankan Inland Revenue Department (IRD) & SLTDA statutory requirements.
# 2. Central Bank of Sri Lanka (CBSL) LankaQR EMVCo standards.
# 3. Apple Human Interface Guidelines (HIG) responsive tokens and states.
# 4. AWS AppSync native scalars and multi-auth directives.
# ==============================================================================

# ==============================================================================
# AWS AppSync Native Custom Scalars
# ==============================================================================

"""
An extended ISO 8601 date string in the format YYYY-MM-DD.
"""
scalar AWSDate

"""
An extended ISO 8601 time string in the format hh:mm:ss.sss.
"""
scalar AWSTime

"""
An extended ISO 8601 date and time string in the format YYYY-MM-DDThh:mm:ss.sssZ.
Evaluated in or normalized to Asia/Colombo (UTC+05:30) for statutory records.
"""
scalar AWSDateTime

"""
An integer value representing seconds past unix epoch (1970-01-01T00:00:00Z).
"""
scalar AWSTimestamp

"""
An RFC 5322 compliant email address string.
"""
scalar AWSEmail

"""
A string containing serialized JSON data.
"""
scalar AWSJSON

"""
An RFC 3986 compliant Uniform Resource Locator string.
"""
scalar AWSURL

"""
An E.164 compliant phone number string (e.g. +94771234567 for Sri Lankan mobile).
"""
scalar AWSPhone

"""
An IPv4 or IPv6 network address string.
"""
scalar AWSIPAddress

# ==============================================================================
# AWS AppSync Authorization & Real-Time Subscription Directives
# ==============================================================================

directive @aws_subscribe(mutations: [String!]!) on FIELD_DEFINITION
directive @aws_auth(cognito_groups: [String!]!) on FIELD_DEFINITION
directive @aws_cognito_user_pools(
  cognito_groups: [String!]
) on OBJECT | FIELD_DEFINITION | INTERFACE | UNION
directive @aws_iam on OBJECT | FIELD_DEFINITION | INTERFACE | UNION
directive @aws_lambda on OBJECT | FIELD_DEFINITION | INTERFACE | UNION
directive @aws_api_key on OBJECT | FIELD_DEFINITION | INTERFACE | UNION

